# Single-page app: every unknown path serves index.html (react-router).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # (no add_header inside the locations below: it would drop these)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite puts a content hash in these file names: cache them for a year
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location / {
        # index.html must always be revalidated to pick up new deployments
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
