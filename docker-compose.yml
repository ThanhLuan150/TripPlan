# Production-like stack. Used by the CD pipeline on the server (images from
# GHCR, IMAGE_TAG set by deploy/deploy.sh) and locally with `docker compose up --build`.
#
# Needs backend/.env next to this file (see backend/.env.example).

services:
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/thanhluan150/tripplan-backend}:${IMAGE_TAG:-latest}
    build: ./backend
    env_file: ./backend/.env
    environment:
      NODE_ENV: production
      PORT: "8080"
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  web:
    image: ${WEB_IMAGE:-ghcr.io/thanhluan150/tripplan-web}:${IMAGE_TAG:-latest}
    build:
      context: ./web
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    ports:
      - "${WEB_PORT:-80}:8080"
    depends_on:
      - backend
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
