name: Dependency review

# Fails a PR that adds or upgrades to a dependency with a known high /
# critical vulnerability (backend yarn.lock and web package-lock.json).
on:
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # summary comment on failure
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
