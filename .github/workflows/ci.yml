name: CI

# Lint, type-check, unit tests (with coverage gate) and build, for every PR and
# every push to dev. The CD workflow calls this one first, so nothing reaches
# production without passing it.
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev]
  workflow_dispatch:
  workflow_call:
    inputs:
      skip_docker:
        description: Skip the Docker image build check (the caller builds the images itself)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # a new push to a PR cancels the previous run of that PR
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  FORCE_COLOR: "1"

jobs:
  backend:
    name: Backend · lint & test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      # Yarn 3 (berry) comes from the "packageManager" field through corepack
      - name: Enable corepack
        run: corepack enable

      - name: Locate Yarn cache
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ hashFiles('backend/yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Unit & integration tests (coverage gate)
        run: yarn test:coverage

      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('backend/coverage/coverage-summary.json') != '' }}
        run: node ../.github/scripts/coverage-summary.mjs "Backend" coverage/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 14
          if-no-files-found: ignore

  web:
    name: Web · lint, typecheck, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests (coverage gate)
        run: npm run test:coverage

      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('web/coverage/coverage-summary.json') != '' }}
        run: node ../.github/scripts/coverage-summary.mjs "Web" coverage/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: web-coverage
          path: web/coverage/
          retention-days: 14
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist/
          retention-days: 7

  audit:
    name: Web · npm audit (production deps)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Report only: a newly published advisory shows up as a warning and in the
    # job summary (and gets a Dependabot PR) without turning unrelated PRs red.
    # PRs that *add* a vulnerable dependency are blocked by dependency-review.yml.
    # (The backend's yarn.lock is covered by Dependabot alerts and dependency
    # review: Yarn 3's `yarn npm audit` calls an npm endpoint that no longer exists.)
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: npm audit
        run: |
          if npm audit --omit=dev --audit-level=high > audit.txt; then
            echo "No high / critical vulnerability in the production dependencies." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=npm audit::High / critical vulnerabilities in web production dependencies (see the job summary)"
            {
              echo "### npm audit (web, production dependencies)"
              echo '```'
              cat audit.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          cat audit.txt

  docker:
    name: Docker · ${{ matrix.service }}
    needs: [backend, web]
    # (inputs is empty outside workflow_call: !null is true)
    if: ${{ !inputs.skip_docker }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [backend, web]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service }}
          push: false
          tags: tripplan-${{ matrix.service }}:ci
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
