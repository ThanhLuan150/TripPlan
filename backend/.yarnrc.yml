# Install packages into a real node_modules folder instead of Yarn Plug'n'Play,
# so the backend also runs with npm / plain node.
nodeLinker: node-modules

# `yarn workspaces focus --production` (Dockerfile: install runtime deps only)
plugins:
  - path: .yarn/plugins/@yarnpkg/plugin-workspace-tools.cjs
    spec: "@yarnpkg/plugin-workspace-tools"
